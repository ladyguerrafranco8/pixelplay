<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1180" width="1000" height="1180">
  <defs>
    <linearGradient id="red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d13a2e"/>
      <stop offset="100%" stop-color="#b12b21"/>
    </linearGradient>
    <linearGradient id="navy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a2c52"/>
      <stop offset="100%" stop-color="#0f1c38"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c7a463"/>
      <stop offset="100%" stop-color="#a9834a"/>
    </linearGradient>

    <path id="shieldOuter" d="M500,50
      Q 420 88 158 193
      C 42 246 4 372 4 490
      C 4 642 88 840 248 972
      C 348 1054 430 1086 500 1150
      C 570 1086 652 1054 752 972
      C 912 840 996 642 996 490
      C 996 372 958 246 842 193
      Q 580 88 500 50 Z"/>

    <path id="shieldInner" d="M500,86
      Q 434 118 210 210
      C 108 254 74 362 74 468
      C 74 600 148 772 288 888
      C 372 958 442 984 500 1040
      C 558 984 628 958 712 888
      C 852 772 926 600 926 468
      C 926 362 892 254 790 210
      Q 566 118 500 86 Z"/>

    <clipPath id="clipInner"><use href="#shieldInner"/></clipPath>
  </defs>

  <!-- outer cream medallion band -->
  <use href="#shieldOuter" fill="#f7f1de" stroke="#101d3a" stroke-width="9"/>

  <!-- inner content: diagonal red / navy split -->
  <g clip-path="url(#clipInner)">
    <rect x="60" y="70" width="880" height="1000" fill="url(#red)"/>
    <polygon points="926,190 926,1040 300,1040" fill="url(#navy)"/>
  </g>
  <use href="#shieldInner" fill="none" stroke="#101d3a" stroke-width="7"/>
  <use href="#shieldInner" fill="none" stroke="#f7f1de" stroke-width="3"
       transform="translate(500,565) scale(0.983) translate(-500,-565)"/>

  <!-- MUJERES arched -->
  <defs>
    <path id="arcTop" d="M 230 330 C 300 255 700 255 770 330" fill="none"/>
  </defs>
  <text font-family="Georgia, 'Times New Roman', serif" font-size="62" font-weight="700"
        letter-spacing="10" fill="url(#gold)">
    <textPath href="#arcTop" startOffset="50%" text-anchor="middle">MUJERES</textPath>
  </text>

  <!-- ribbon banner -->
  <g>
    <!-- folded ends -->
    <polygon points="170,655 20,700 80,750 20,800 170,845" fill="#0f1c38"/>
    <polygon points="830,655 980,700 920,750 980,800 830,845" fill="#0f1c38"/>
    <polygon points="20,700 80,750 20,800 55,750" fill="#0a1428"/>
    <polygon points="980,700 920,750 980,800 945,750" fill="#0a1428"/>

    <!-- main band -->
    <path d="M170,655 L830,655 L830,845 L170,845 Z" fill="url(#navy)"/>
    <path d="M170,663 L830,663" stroke="#f7f1de" stroke-width="4" opacity="0.85"/>
    <path d="M170,837 L830,837" stroke="#f7f1de" stroke-width="4" opacity="0.85"/>

    <text x="500" y="790" font-family="Georgia, 'Times New Roman', serif" font-size="112"
          font-weight="700" letter-spacing="6" fill="#fbf8ef" text-anchor="middle">DIM</text>
  </g>

  <!-- 2025 -->
  <text x="500" y="965" font-family="Georgia, 'Times New Roman', serif" font-size="42"
        font-weight="600" letter-spacing="14" fill="url(#gold)" text-anchor="middle">2025</text>
</svg>
